name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          cd backend
          python -m pytest --tb=short
        env:
          AI_PROVIDER: stub
      - name: Secret leak scan
        run: |
          ! grep -rniE 'sk-[A-Za-z0-9]{20,}|BEGIN.*PRIVATE|cfut_' --exclude-dir=__pycache__ --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.codegraph --exclude-dir=.ai --exclude-dir=tasks --exclude=.env --exclude=.env.example --exclude=ci.yml .
      - name: Alembic migration check
        run: |
          cd backend
          python -m alembic history
          python -m alembic upgrade head --sql > /dev/null
      - name: Evaluation smoke (stub provider)
        run: |
          AI_PROVIDER=stub python evaluation/evaluate.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run build
        run: |
          cd frontend
          npm run build
      - name: Run tests (if present)
        run: |
          cd frontend
          npm test --if-present
